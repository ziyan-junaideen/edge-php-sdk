name: PHP Composer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.3', '8.0', '8.3', '8.4']
    steps:
    - uses: actions/checkout@v7
    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: mbstring, dom, xml, xmlwriter
        coverage: none
        tools: composer:v2
    - name: Validate package metadata
      run: composer validate --strict
    # This library does not commit a lock file. Resolve on the actual runtime;
    # never reuse vendor or a lock generated by another PHP matrix entry.
    - name: Resolve runtime-compatible dependencies
      run: composer update --prefer-dist --no-progress --no-interaction
    - name: Check runtime requirements
      run: composer check-platform-reqs
    - name: Run test suite
      run: composer test
